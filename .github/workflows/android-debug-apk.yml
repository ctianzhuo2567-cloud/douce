name: Build signed Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release signing key
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/douce-release.jks"

      - name: Run unit tests and Android lint
        run: ./gradlew testReleaseUnitTest lintRelease

      - name: Build signed release APK
        env:
          DOUCE_KEYSTORE_PATH: ${{ runner.temp }}/douce-release.jks
          DOUCE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          DOUCE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          DOUCE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify pinned release signature
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          echo "$OUTPUT"
          NORMALIZED="$(printf '%s' "$OUTPUT" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          EXPECTED="04ee64295a8e326205a0750f6f89346907f8d216f01f953241b3482737b04d7d"
          printf '%s' "$NORMALIZED" | grep -q "$EXPECTED"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: douce-android-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare release APK
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: cp app/build/outputs/apk/release/app-release.apk "douce-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "douce-${GITHUB_REF_NAME}.apk#豆册 ${GITHUB_REF_NAME} APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "豆册 ${GITHUB_REF_NAME}" \
            --notes "正式签名安卓版本。支持完整 ZIP 数据备份与恢复; 全新安装不包含图纸或库存数据。"
