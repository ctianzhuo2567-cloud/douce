name: Build signed Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, codex/v0.6.0-grid-recognition]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve app release tag
        shell: bash
        run: |
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION"
          echo "DOUCE_RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Decode release signing key
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/douce-release.jks"

      - name: Run unit tests and Android lint
        run: ./gradlew testDebugUnitTest lintRelease

      - name: Build signed release APK
        env:
          DOUCE_KEYSTORE_PATH: ${{ runner.temp }}/douce-release.jks
          DOUCE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          DOUCE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          DOUCE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify pinned release signature
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          echo "$OUTPUT"
          NORMALIZED="$(printf '%s' "$OUTPUT" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          EXPECTED="04ee64295a8e326205a0750f6f89346907f8d216f01f953241b3482737b04d7d"
          printf '%s' "$NORMALIZED" | grep -q "$EXPECTED"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: douce-android-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare release APK
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: cp app/build/outputs/apk/release/app-release.apk "douce-${DOUCE_RELEASE_TAG}.apk"

      - name: Publish GitHub Release when missing
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$DOUCE_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $DOUCE_RELEASE_TAG already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$DOUCE_RELEASE_TAG" \
            "douce-$DOUCE_RELEASE_TAG.apk#豆册 $DOUCE_RELEASE_TAG APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "豆册 $DOUCE_RELEASE_TAG" \
            --generate-notes \
            --notes "正式签名安卓版本。全新安装不包含图纸或库存数据，升级安装会保留现有本地数据；建议升级前先在 App 内导出备份。"
